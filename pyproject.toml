[project]
name = "mlx-timesfm"
version = "0.1.0"
description = "TimesFM 3.0 time-series foundation model in MLX (Apple silicon)"
readme = "README.md"
authors = [
    { name = "BP", email = "11394934+benjipeng@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.32.2",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.5.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# tests/parity modules are importable siblings (bridge imports `cases` at
# runtime in both the .venv and .venv-torch interpreters)
known-first-party = ["cases", "bridge", "mlx_runner", "torch_runner"]
